<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Izy Focus J</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <div class="container">
        <h1>Configurações da Izy Focus J</h1>

        <section>
            <h2>Listas de Bloqueio Pré-definidas</h2>
            <p>Selecione categorias para bloquear rapidamente grupos de sites comuns.</p>
            <div id="predefined-lists">
                <!-- Checkboxes serão inseridos aqui pelo JS -->
            </div>
        </section>

        <section>
            <h2>Lista de Bloqueio Personalizada</h2>
            <p>Adicione ou remova domínios específicos da sua lista de bloqueio.</p>
            <div class="input-group">
                <input type="text" id="new-site-input" placeholder="ex: twitter.com">
                <button id="add-site-button">Adicionar</button>
            </div>
            <ul id="block-list">
                <!-- Sites bloqueados serão inseridos aqui pelo JS -->
            </ul>
        </section>

        <footer class="made-by-footer">
            Feito com 💛 por Pedro Márcio Di Pietro.
        </footer>
    </div>
    <script src="options.js"></script>
</body>
</html>
