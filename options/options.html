<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Izy Focus C</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <div class="container">
        <h1>Configurações da Izy Focus C</h1>

        <section>
            <h2>Lista de Bloqueio</h2>
            <p>Adicione os domínios dos sites que você deseja bloquear (ex: "youtube.com", "facebook.com").</p>
            <div class="input-group">
                <input type="text" id="new-site-input" placeholder="ex: twitter.com">
                <button id="add-site-button">Adicionar</button>
            </div>
            <ul id="block-list">
                <!-- Sites bloqueados serão inseridos aqui pelo JS -->
            </ul>
        </section>
    </div>
    <script src="options.js"></script>
</body>
</html>
